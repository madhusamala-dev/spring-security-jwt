spring:
  application:
    name: spring-security
server:
  port: 8080
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

    url: jdbc:mysql://localhost:3306/ecommerce_db

    username: root

    password: root

  jpa:

    hibernate:
      ddl-auto: update

    show-sql: true

    properties:

      hibernate:

        format_sql: true

        dialect: org.hibernate.dialect.MySQL8Dialect

jwt:
  validity:
    accessToken: 86400000
    refreshToken: 2592000000
  secret: jwt-secret-code

